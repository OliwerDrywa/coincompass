name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Format
            command: npm run format:check
          - name: Typecheck
            command: npm run typecheck
          - name: Unit tests
            command: npm test
          - name: Build
            command: npm run build
          - name: Knip
            command: npm run knip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.check.command }}
